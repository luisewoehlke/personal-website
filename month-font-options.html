<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Month font options</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Literata:opsz,wght@7..72,500&family=Lora:wght@500&family=Newsreader:opsz,wght@6..72,500&family=Source+Serif+4:opsz,wght@8..60,500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background: #ffccac;
        color: #5e2808;
      }

      ol {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 2.5rem 3rem;
      }

      li {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }

      .sample {
        margin: 0;
        font-size: 1.45rem;
        line-height: 1.2;
        font-weight: 500;
      }

      .label {
        font-family: "Segoe UI", system-ui, sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.02em;
      }

      .newsreader {
        font-family: Newsreader, Georgia, serif;
      }

      .lora {
        font-family: Lora, Georgia, serif;
        font-weight: 500;
      }

      .source {
        font-family: "Source Serif 4", Georgia, serif;
      }

      .baskerville {
        font-family: "Libre Baskerville", Georgia, serif;
        font-weight: 400;
      }

      .literata {
        font-family: Literata, Georgia, serif;
      }
    </style>
  </head>
  <body>
    <ol>
      <li>
        <p class="sample newsreader">July</p>
        <span class="label">1. Newsreader</span>
      </li>
      <li>
        <p class="sample lora">July</p>
        <span class="label">2. Lora</span>
      </li>
      <li>
        <p class="sample source">July</p>
        <span class="label">3. Source Serif 4</span>
      </li>
      <li>
        <p class="sample baskerville">July</p>
        <span class="label">4. Libre Baskerville</span>
      </li>
      <li>
        <p class="sample literata">July</p>
        <span class="label">5. Literata</span>
      </li>
    </ol>
  </body>
</html>
